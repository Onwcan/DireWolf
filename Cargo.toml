[workspace]
resolver = "3"
members = [
    "crates/direwolf-cli",
    "crates/dwk-proto",
    "crates/dwkd-authority",
    "crates/dwkd-broker",
    "tools/protogen",
]

# ---------------------------------------------------------------------------
# Shared package metadata.  `version` is synchronised from the repository-root
# VERSION file by `dwcheck version --write`; do not edit it by hand.
# ---------------------------------------------------------------------------
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/Onwcan/DireWolf"
authors = ["The DireWolf authors"]

# ---------------------------------------------------------------------------
# Workspace dependency table.
#
# DEPENDENCY POLICY (see CONTRIBUTING.md "Adding a dependency"):
#   * Every third-party dependency is declared here once and inherited by
#     member crates with `dep = { workspace = true }`.  A crate may not declare
#     a third-party dependency directly; `dwcheck deps` rejects that.
#   * `dwkd-authority` is the trusted computing base.  Its dependency set is a
#     load-bearing claim of ADR-0019, so anything added to it needs a new ADR
#     amending that one (never an edit to it) and a second reviewer.  The
#     allowlist lives in architecture.toml.
#
# No crate reachable from a shipped binary or from dwk-proto is third-party:
# the TCB-destined closure is empty (ADR-0034).  The only third-party crates in
# the tree are dev-only test crates, below, and the fuzz workspace's own; the
# inventory is in CONTRIBUTING.md "Adding a dependency".
# ---------------------------------------------------------------------------
[workspace.dependencies]
# --- in-tree ---------------------------------------------------------------
dwk-proto = { path = "crates/dwk-proto" }

# --- reachable from the TCB (dwk-proto -> dwkd-authority from M3) -----------
# Anything here is inside the trusted computing base, so it needs an entry in
# architecture.toml [authority].allowed_third_party and a new ADR amending
# ADR-0019.  ADR-0035 accepted this one and ADR-0038 records what M3c actually
# linked, which is one crate fewer than ADR-0035 measured.
#
# Pinned exactly.  A policy parser is the authority's only third-party reader of
# operator input, and "the patch release the resolver picked" is not a version
# anyone reviewed; `cargo update` must not move it without a reviewer.
#
# No `serde` feature: the loader walks toml::de::DeTable, which carries the byte
# spans `rule_source` needs and is available behind `parse` alone.  toml::Value
# would have needed serde_core and would not have carried the spans, so the
# smaller closure is also the more capable one.  No derive macros anywhere: a
# derive that silently accepts a field is the failure strict configuration
# exists to prevent (ADR-0035 section 2).
toml = { version = "=1.1.6", default-features = false, features = ["parse"] }

# kernel.db (M3d). `bundled` compiles SQLite's C amalgamation into the
# authority: the largest trusted-code addition in the project, accepted by
# ADR-0035 because an authority whose durability depends on whichever SQLite
# the host ships is not one anyone can make claims about. ADR-0039 records the
# measured closure, which includes build-only crates that EXECUTE while the TCB
# is built and are reviewed in their own allowlist.
#
# Pinned exactly for the same reason as `toml`. No default features: the
# defaults turn on a prepared-statement cache (`hashlink`) and a WebAssembly
# backend, and the authority needs neither.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

# The audit hash chain and every content-derived identity (policy revision,
# AdmitRun request digest). RustCrypto's implementation, pure Rust, no
# default features: no `alloc` convenience API and no OID tables.
sha2 = { version = "=0.11.0", default-features = false }

# --- dev-only: tests, property tests, differential oracles ------------------
# Never linked into a shipped binary. dwcheck excludes dev-only edges from the
# TCB closure and a fixture proves it does not exclude normal ones.
proptest = { version = "1.11", default-features = false, features = ["std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

# ---------------------------------------------------------------------------
# Lints, applied to every member crate via `[lints] workspace = true`.
#
# `unsafe_code = "forbid"` is workspace-wide and M1 contains no exception.
# The policy for future exceptions is in CONTRIBUTING.md "Unsafe Rust"; an
# exception is a crate-level decision recorded in an ADR, never a file-level
# `#[allow]`.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_crate_dependencies = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Security-relevant footguns, denied everywhere rather than merely warned.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
integer_division = "warn"
as_conversions = "warn"
mem_forget = "deny"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[profile.release]
# A small, auditable binary is part of the product claim.  One codegen unit
# removes one source of build-to-build variation (parallel codegen
# partitioning).  That is NOT a reproducible build: embedded paths, the host
# toolchain installation and the linker can still change the output, and no
# one has verified that two builds of the same commit are bit-identical.
# Reproducible release artifacts are deferred release engineering (ROADMAP M1
# "Deferred"); do not describe a checksum as a function of the source alone.
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
# Keep the edit/build/test loop fast; the workspace is tiny.
debug = 1
