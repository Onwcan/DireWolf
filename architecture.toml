# ===========================================================================
# DireWolf architecture boundary rules, as data.
#
# `dwcheck` reads this file and enforces it.  Rules live here rather than in
# the checker's source so that a reviewer can read the boundaries without
# reading Python, and so that the same rules can be pointed at a fixture tree
# in a negative test (`tests/architecture/`).
#
# ---------------------------------------------------------------------------
# WHAT THESE RULES ARE
#
# Development hygiene.  They stop the architecture eroding through ordinary
# development: an import added in a hurry, a provider name leaking out of the
# adapter layer, a crate quietly depending on the one it must not.
#
# WHAT THESE RULES ARE NOT
#
# A security boundary.  Every one of them is a *static* check over source text.
# A prompt-injected `exec()` inside the runtime can call `__import__("socket")`
# and no rule here will ever run.  The actual controls are the OS process and
# privilege boundary between the runtime and `dwkd-authority`, the absence of a
# network route on the runtime identity, and the absence of any credential in
# the runtime's address space.  See docs/ARCHITECTURE.md §6 and docs/SECURITY.md.
#
# Do not cite a passing `dwcheck` run as evidence of containment.
# ===========================================================================

schema_version = 1

# ---------------------------------------------------------------------------
# Version: one source of truth.
# `dwcheck version --check` asserts these agree with VERSION; `--write`
# updates them from it.
# ---------------------------------------------------------------------------
[version]
source = "VERSION"

[[version.mirrors]]
path = "Cargo.toml"
kind = "toml"
section = "workspace.package"
pattern = '(?m)^(?P<prefix>version = ")(?P<version>[^"]+)(?P<suffix>")$'

[[version.mirrors]]
path = "runtime/pyproject.toml"
kind = "toml"
section = "project"
pattern = '(?m)^(?P<prefix>version = ")(?P<version>[^"]+)(?P<suffix>")$'

[[version.mirrors]]
path = "tools/dwcheck/pyproject.toml"
kind = "toml"
section = "project"
pattern = '(?m)^(?P<prefix>version = ")(?P<version>[^"]+)(?P<suffix>")$'

# The runtime carries its version as a literal rather than reading installed
# distribution metadata: importlib.metadata transitively imports `email`, which
# imports `socket`.  See runtime/src/direwolf/_version.py.
[[version.mirrors]]
path = "runtime/src/direwolf/_version.py"
kind = "regex"
section = ""
pattern = '(?m)^(?P<prefix>__version__ = ")(?P<version>[^"]+)(?P<suffix>")$'

[[version.mirrors]]
path = "tools/dwcheck/src/dwcheck/__init__.py"
kind = "regex"
section = ""
pattern = '(?m)^(?P<prefix>__version__ = ")(?P<version>[^"]+)(?P<suffix>")$'

# ===========================================================================
# Python import rules
# ===========================================================================

[[python_rules]]
id = "PY001-runtime-has-no-ambient-effects"
paths = ["runtime/src"]
# `direwolf.kernelclient` is the ONE module permitted to open the kernel
# socket -- that is its entire job (docs/ARCHITECTURE.md §6).  It does not
# exist yet; the exemption is written now so the rule does not have to be
# rewritten under time pressure at M9.
exempt_paths = ["runtime/src/direwolf/kernelclient"]
banned_modules = [
    "socket", "ssl", "selectors",
    "http.client", "urllib.request", "urllib.error", "ftplib", "smtplib",
    "requests", "httpx", "aiohttp", "urllib3", "websockets",
    "subprocess", "multiprocessing", "pty",
    "ctypes", "cffi", "mmap", "resource", "pwd", "grp",
]
banned_attributes = [
    "os.system", "os.popen", "os.fork", "os.forkpty",
    "os.execv", "os.execve", "os.execvp", "os.spawnv", "os.spawnl",
    "os.setuid", "os.setgid",
]
reason = """
The cognition plane holds no network route, no execution path and no
credential.  A dependency or import that assumes otherwise is a design error
surfacing early.  `kernelclient` is exempt because DWKP over a Unix socket is
the single sanctioned path from cognition to effect (ADR-0000).
"""

[[python_rules]]
id = "PY002-no-agent-framework-imports"
paths = ["runtime/src", "tools", "tests", "evals"]
# The fixtures under tests/architecture/ are deliberately invalid: they exist to
# be rejected by these rules when the checker is pointed at them, which is how
# we prove the gate works (tests/architecture/README.md).
exempt_paths = ["tests/architecture/fixtures"]
banned_modules = [
    "langchain", "langchain_core", "langchain_community", "langgraph",
    "llama_index", "agents", "openai_agents", "crewai", "autogen",
    "semantic_kernel", "haystack", "dspy", "smolagents", "pydantic_ai",
]
banned_attributes = []
reason = """
DireWolf is a runtime you run agents on, not a framework you write agents in,
and it is explicitly not a consumer of another autonomous-agent framework
(docs/ARCHITECTURE.md §2, non-goals).  Such a framework under the core loop
would own the loop, the tool-call path and the control flow -- exactly the
structure this architecture exists to replace.  Interoperating with one at the
edges is a different question and is not what this rule forbids.
"""

[[python_rules]]
id = "PY003-product-code-does-not-import-the-eval-harness"
paths = ["runtime/src", "tools/dwcheck/src", "gateway"]
exempt_paths = []
banned_modules = ["direwolf_evals"]
banned_attributes = []
reason = """
`direwolf_evals` is test infrastructure.  It holds a deliberately simple
execution-environment double and a process-control harness that can spawn a
child, and both exist to measure DireWolf -- not to be part of it.  A product
module that imported them would turn a test convenience into a second path from
cognition to effect, which is the failure this architecture exists to prevent
(ADR-0000).  The eval package may import the runtime; never the reverse.
"""

# ===========================================================================
# Text rules -- names that must not appear outside their owning directory.
# ===========================================================================

[[text_rules]]
id = "TX001-provider-names-confined"
paths = ["runtime/src"]
exempt_paths = ["runtime/src/direwolf/providers"]
suffixes = [".py"]
patterns = [
    '(?i)\banthropic\b',
    '(?i)\bopenai\b',
    '(?i)\bgpt-[0-9]',
    '(?i)\bclaude-[0-9]',
    '(?i)\bgemini\b',
    '(?i)\bbedrock\b',
    '(?i)\bollama\b',
    '(?i)\bmistral\b',
    '(?i)\bcohere\b',
]
reason = """
Goal G3, model agnosticism: swapping providers changes configuration, not core
code.  The stated measure is that a search for a provider name returns nothing
outside the adapter package (docs/ARCHITECTURE.md §1).  Checked as text rather
than as imports because the leak that matters is usually a string literal or a
branch on a model name, not an import.
"""

[[text_rules]]
id = "TX002-proto-has-no-ambient-effects"
paths = ["crates/dwk-proto/src"]
exempt_paths = []
suffixes = [".rs"]
# Lines starting with `//` are skipped so the crate can document what it must
# not do. A multi-line `use std::{ ... }` evades the brace pattern; this is a
# tripwire for the ordinary mistake, not a proof (see the header of this file).
patterns = [
    '^(?!\s*//).*\bstd\s*::\s*(fs|net|process|env|os)\b',
    '^(?!\s*//).*\bstd\s*::\s*\{[^}]*\b(fs|net|process|env|os)\b',
    '^(?!\s*//).*\bunsafe\b',
    '^(?!\s*//).*\b(allow|expect)\s*\(\s*unsafe_code\b',
]
reason = """
dwk-proto is wire types and value objects (ADR-0033).  From M3 it is linked into
dwkd-authority, and both daemons link it, so an effect here is an effect in the
trusted computing base and on both sides of the ADR-0018 split.  Decoding a
message must not be able to touch a file, a socket, a process or the
environment.  `unsafe_code` is also forbidden workspace-wide; the pattern keeps
an `#[allow]` from quietly reintroducing it in the one crate both daemons share.
"""

[[text_rules]]
id = "TX003-capability-core-has-no-ambient-effects"
paths = ["crates/dwkd-authority/src/capability"]
exempt_paths = []
suffixes = [".rs"]
# As TX002: comment lines are skipped so the module can document what it must
# not do, and a multi-line `use std::{ ... }` is covered by the brace pattern.
patterns = [
    '^(?!\s*//).*\bstd\s*::\s*(fs|net|process|env|os)\b',
    '^(?!\s*//).*\bstd\s*::\s*\{[^}]*\b(fs|net|process|env|os)\b',
    '^(?!\s*//).*\bunsafe\b',
    '^(?!\s*//).*\b(allow|expect)\s*\(\s*unsafe_code\b',
]
reason = """
The capability core answers "is this authority shape contained by that one?".
It is a pure function of its arguments: parse, compare, narrow.  An effect here
would be an effect inside the trusted computing base, and a filesystem read in
particular would be the beginning of the mistake ADR-0037 exists to prevent --
deciding authority from a path by looking at the path, before M4's canonicaliser
exists to do it safely.

Deriving a canonical resource identity IS filesystem work, and it belongs in
M4's resolver, which feeds the result in as a value.  The boundary is therefore
where the I/O is, not whether there is any.

As with every rule in this file: hygiene, not containment.  A static check over
source text cannot stop anything at run time.
"""

[[text_rules]]
id = "TX004-policy-core-has-no-ambient-effects"
paths = ["crates/dwkd-authority/src/policy"]
exempt_paths = []
suffixes = [".rs"]
# As TX002 and TX003: comment lines are skipped so the module can document what
# it must not do, and a multi-line `use std::{ ... }` is covered by the brace
# pattern.
patterns = [
    '^(?!\s*//).*\bstd\s*::\s*(fs|net|process|env|os)\b',
    '^(?!\s*//).*\bstd\s*::\s*\{[^}]*\b(fs|net|process|env|os)\b',
    '^(?!\s*//).*\bunsafe\b',
    '^(?!\s*//).*\b(allow|expect)\s*\(\s*unsafe_code\b',
]
reason = """
The policy engine is a pure function of its arguments (POLICY.md section 4):
canonical action, typed context, compiled policy, out comes a decision.  No IO,
no clock, no randomness.  Each of the banned modules would break a different
part of that.

`std::env` is the one worth naming.  Policy rules write `${WORKSPACE}` and
`~/.ssh`, which LOOK like shell, and are not: they are closed symbolic anchors
resolved from kernel-owned state.  If the policy engine could ask the process
environment what `${WORKSPACE}` means, then whoever sets that variable decides
which directory the workspace rules govern -- and the whole point of pinning
the workspace root by (dev, ino) at admission is that the NAME can be made to
lie.

`std::net` is banned even though `ip_in` compares addresses, which is why
`IpAddress` holds octets rather than std::net::IpAddr: the rule needs no
exception, and an import list with no networking module in it is easier to
check than an argument about which networking types are inert.

Reading the operator's policy FILE is not inside the policy core.  `load` takes
text; the authority layer that owns the policy directory opens it.  The
boundary is where the IO is.

As with every rule in this file: hygiene, not containment.
"""

# ===========================================================================
# Documentation
# ===========================================================================

[docs]
# Relative links and ADR citations are checked in every Markdown file except
# these. The fixture tree contains deliberately broken links.
exempt_paths = ["tests/architecture/fixtures"]

# ---------------------------------------------------------------------------
# Accepted ADRs are immutable (docs/adr/README.md).  The rule was broken once by
# an appended note that no gate caught, so `dwcheck adr` enforces it twice:
#
#   * against Git history -- the revision in which each ADR became Accepted.
#     This is the trust anchor.  A change cannot move it, because it is not in
#     the change; in CI the base is the merge base with the target branch.
#   * against `manifest`, a digest file.  This is a tripwire for accidental
#     drift, and the half that still works with no history (a release tarball).
#     It is NOT an immutability control: it lives in the same mutable tree as
#     the ADRs, so one change can edit an ADR and re-run `--record` together.
#
# Adding an ADR means running `dwcheck adr --record` in the same commit.
# ---------------------------------------------------------------------------
[adr]
directory = "docs/adr"
manifest = "docs/adr/accepted.sha256"

# Authorised departures from the accepted content in history.  Each one pins the
# single content it authorises, so it corrects one record rather than making a
# file mutable; an entry that matches nothing is itself a violation (ADR006).
# Adding one of these says, in words, that ADR immutability is being overridden
# -- which is the point.  Re-running `--record` does not say that.
[[adr.history_exceptions]]
file = "0019-language-rationale-v2.md"
sha256 = "7dd806047bdb4fcfb4883d5835f44dc0e9a03bd0eac314c032db6003a3a25882"
reason = """
M2 appended a dated Notes section to this accepted ADR, in violation of rule 1
and rule 3 of docs/adr/README.md, and the public repository's history was
bootstrapped from a tree that already contained it.  The M2 closeout restored
the accepted content; this entry authorises exactly that restoration and nothing
else.  The dependency review the note carried lives in ADR-0033 section 4, and
what became of it in ADR-0034.
"""

# ===========================================================================
# Declared-dependency rules (Python manifests)
#
# Banned *Rust* crates live in deny.toml, which is the tool that reads Cargo
# metadata; duplicating them here would create two places to update.
# ===========================================================================

[[dependency_rules]]
id = "DEP001-no-agent-framework-dependency"
manifests = ["pyproject.toml", "runtime/pyproject.toml", "tools/dwcheck/pyproject.toml"]
banned = [
    "langchain", "langchain-core", "langchain-community", "langgraph",
    "llama-index", "openai-agents", "crewai", "pyautogen", "autogen-agentchat",
    "semantic-kernel", "haystack-ai", "dspy-ai", "smolagents", "pydantic-ai",
]
reason = "As PY002, but caught at the manifest so it never reaches a lockfile."

[[dependency_rules]]
id = "DEP002-runtime-has-no-transport-dependency"
manifests = ["runtime/pyproject.toml"]
banned = ["requests", "httpx", "aiohttp", "urllib3", "websockets", "grpcio", "boto3"]
reason = """
The runtime cannot reach the network.  A transport dependency in its manifest
means someone is designing a second path from cognition to effect; that
requires an ADR addressing ADR-0000, not a dependency bump.
"""

# ===========================================================================
# Rust crate rules
# ===========================================================================

[crates]
manifest = "Cargo.toml"
directory = "crates"
# Every third-party dependency is declared once in [workspace.dependencies] and
# inherited.  A crate declaring a version directly bypasses the single place a
# reviewer looks to see what is in the tree.
require_workspace_dependencies = true
# No workspace crate may depend on these, whatever it is called.  The named
# rules below cover the crates that exist today; this covers the one somebody
# adds later to "share a little code between authority and broker", which is
# how the boundary in ADR-0018 would actually be lost.
undependable = ["dwkd-authority", "dwkd-broker"]
# The in-tree crates both daemons may link (RS008), each of which must link no
# other in-tree crate (RS009).  The wire contract is the one sanctioned case:
# authority and broker must agree on DWKP.  Adding a name here is an
# architecture decision that needs an ADR, not a manifest edit.
shared = ["dwk-proto"]

[[crate_rules]]
id = "RS001-authority-depends-on-nothing-in-tree"
crate = "dwkd-authority"
forbidden_dependencies = ["dwkd-broker", "direwolf-cli", "direwolf"]
reason = """
Authority decides; the broker executes (ADR-0018).  A dependency edge from
authority to the broker would put the broker's dependency tree -- a container
client, an HTTP/TLS stack, content parsers -- inside the address space holding
the MAC key and the secrets, which is precisely what the split exists to
prevent.
"""

[[crate_rules]]
id = "RS002-broker-cannot-reach-authority-internals"
crate = "dwkd-broker"
forbidden_dependencies = ["dwkd-authority", "direwolf-cli"]
reason = """
The broker must not be able to decide anything: no policy evaluation, no
capability minting, no approval matching.  Linking authority's code into the
broker would make those reachable by construction.  The broker receives a
per-invocation authorisation and performs exactly that.
"""

[[crate_rules]]
id = "RS003-cli-holds-no-authority"
crate = "direwolf-cli"
forbidden_dependencies = ["dwkd-authority", "dwkd-broker"]
reason = """
The CLI is presentation.  It supervises and talks to daemons over their
protocols; it does not link them.  Linking would put authority code in a
process a user launches directly, with that user's privileges.
"""

# The TCB's dependency set is a load-bearing claim of ADR-0019, and as of M3c
# it is NO LONGER EMPTY.  Dev-dependencies (proptest, serde_json) are excluded
# because they are never linked; tools/dwcheck/tests prove a normal dependency
# is not excluded.
#
# The rule has NOT become "the authority may use dependencies".  It has become
# "the closure must equal the list below, which somebody reviewed".
#
# TWO GATES, OF DIFFERENT STRENGTH.  Do not conflate them.
#
#   RS004  manifest allowlist.          Offline.
#   RS006  OFFLINE CONSERVATIVE closure, from Cargo.lock.  Runs with no
#          toolchain, no network and no registry index, which is why it runs
#          on every contributor's machine.  A lockfile pins VERSIONS, not
#          FEATURE SELECTIONS, so it lists optional dependencies nothing
#          activates -- it OVER-approximates, and the `optional_edges` below
#          are what keep it usable.  It is a tripwire.  It is NOT evidence of
#          what the binary links.
#   RS010  EXACT FEATURE-RESOLVED closure, from `cargo metadata --locked`,
#   RS011  with activation computed per package from its own activated
#   RS012  features.  This is the one that describes the artifact.  It needs
#   RS013  cargo, so it is `dwcheck closure` rather than `dwcheck all`, and
#          `make arch` -- inside `make check` -- runs both.
#
# RS010 fails on a crate that is linked and not reviewed; RS011 on a reviewed
# crate that is no longer linked, because an inventory that only ever grows
# stops being a review; RS012 on an `optional_edges` entry whose edge has
# become ACTIVE; RS013 on one that names no edge at all.
#
# WHAT IS HERE AND WHY
#
#   toml            the M3c policy loader's parser.  ADR-0035 accepted it;
#   toml_parser     ADR-0038 records what the resolver actually produced, which
#   toml_datetime   is one crate FEWER than ADR-0035 measured: the loader walks
#   serde_spanned   toml::de::DeTable, available behind the `parse` feature
#   winnow          alone, so `serde_core` never enters.  No serde_derive, no
#                   syn, no quote, no proc-macro2, no native code, no build
#                   script that compiles anything.
#
# Three of these parse the policy text itself -- toml, toml_parser, winnow --
# and that is the concentration of risk this entry creates.  `fuzz/` has
# coverage-guided targets for the loader, and
# crates/dwkd-authority/tests/fuzz_smoke.rs runs the same invariants on stable.
#
# NOT here, and deliberately: rusqlite, libsqlite3-sys, rustix, linux-raw-sys,
# sha2 and the rest of ADR-0035's set.  Each enters in the milestone that first
# LINKS it (M3d, M3e), not in the one that decided it could.
#
# M2 briefly added unicode-normalization here, for NFC comparison of object
# keys.  ADR-0034 removed the need: DWKP rejects every undeclared member and
# every declared name is ASCII, so a normalisation collision is unrepresentable
# without consulting a Unicode database -- which also removed a cross-language
# divergence, because Rust and Python ship different database versions.
#
# Adding an entry requires a new ADR amending ADR-0019 (never an edit to it)
# and a reviewer other than the author.
[authority]
crates = ["dwkd-authority", "dwk-proto"]
allowed_third_party = [
    "toml",
    "toml_parser",
    "toml_datetime",
    "serde_spanned",
    "winnow",
]

# ---------------------------------------------------------------------------
# Optional lockfile edges this workspace does not enable.
#
# These exclusions apply to the OFFLINE CONSERVATIVE gate (RS006) ONLY.  They
# exist because Cargo.lock records an optional dependency whether or not
# anything turns it on: `toml` is linked with features = ["parse"], and two of
# its dependencies declare an optional `serde_core` behind their own `serde`
# feature.  Following those two edges reaches serde_core -> serde_derive ->
# proc-macro2, quote, syn, unicode-ident -- six crates that are in the
# lockfile, are NOT in the binary, and would make this allowlist and every
# document quoting it overstate the trusted computing base.
#
# AN ENTRY HERE IS NOT A PROMISE.  It is a claim that RS012 checks against the
# feature-resolved graph on every `make check`, and the claim expires the
# moment the edge becomes active:
#
#   * edge inactive  -> RS006 skips it, RS012 is satisfied, gate green
#   * edge ACTIVE    -> RS012 FAILS naming the expired entry, and RS010 fails
#                       naming every crate the activation dragged in
#   * edge absent    -> RS013 fails; an exclusion that applies to nothing
#                       cannot be reviewed
#
# So a future change that enables toml's `serde` feature turns CI red without
# anyone touching this file.  That is verified, not asserted:
# tools/dwcheck/tests/test_closure.py flips the feature in a synthetic graph
# and asserts the findings, and the same flip was performed against a real
# checkout during the M3c closeout.
#
# Ground truth, for a reviewer who wants to check by hand:
#
#     cargo tree -p dwkd-authority --edges normal        # five crates
#     CARGO_TARGET_DIR=$(mktemp -d) cargo build -p dwkd-authority --lib --release
#     ls "$CARGO_TARGET_DIR"/release/deps/*.rlib         # five, no serde_core
#
# These are EDGES, not crate exemptions.  An optional dependency not named
# here is still counted by RS006, so a new one cannot arrive unnoticed.
# ---------------------------------------------------------------------------

[[authority.optional_edges]]
parent = "serde_spanned"
child = "serde_core"
reason = """
serde_spanned declares serde_core behind its own `serde` feature.  The policy
loader walks toml::de::DeTable, which is gated on toml's `parse` feature alone
and needs only the Spanned type, so DireWolf does not enable toml's `serde`
feature and this edge is never taken.  ADR-0038 records the measurement.
"""

[[authority.optional_edges]]
parent = "toml_datetime"
child = "serde_core"
reason = """
As serde_spanned: toml_datetime's serde_core dependency is behind its `serde`
feature, which toml enables only when its own `serde` feature is on.  It is
not.  DireWolf never reads a TOML datetime anyway -- the policy schema has no
datetime-valued field, and one appearing in a rule is a type mismatch.
"""
