name: CI

# Every job is one `make` target. CI runs exactly what a contributor runs, so a
# green CI means those commands passed, not that a parallel CI-only script did.
#
# SECURITY POSTURE OF THIS FILE (see CONTRIBUTING.md "CI security"):
#   * Least privilege: read-only token, workflow-wide. No job requests write.
#   * No secrets are available to any job, so a pull request from a fork cannot
#     exfiltrate one.
#   * `pull_request`, not `pull_request_target`: fork code never runs with the
#     base repository's token.
#   * Exactly two third-party-hosted actions are used, both GitHub's own, both
#     pinned by commit SHA. Nothing is installed by piping a URL into a shell.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  format:
    name: format (make fmt-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
      - uses: ./.github/actions/setup
      - run: make fmt-check

  lint:
    name: lint (make lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
      - uses: ./.github/actions/setup
      - run: make lint

  typecheck:
    name: types (make typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - run: make typecheck

  architecture:
    name: boundaries (make arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
        with:
          # Full history, deliberately, and only in this job. `dwcheck adr`
          # anchors each accepted ADR to the revision in which it became
          # Accepted; with the default shallow checkout that revision is
          # truncated away, and the check refuses to run rather than compare
          # against a stand-in. Every other job keeps the default depth.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          rust: "false"
      - run: make arch
      # `make arch` above anchors to HEAD, which proves the working tree matches
      # what was committed. The gate is here: the anchor is the merge base with
      # the target branch, which is outside the pull request and which branch
      # protection keeps that way. docs/adr/accepted.sha256 cannot substitute --
      # a change that edits an accepted ADR can update that file in the same
      # commit, which is precisely the case this step catches.
      - name: Accepted ADRs must match the history that accepted them
        env:
          # Through the environment, not string interpolation: a branch name is
          # attacker-controlled on a fork pull request.
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          elif [ -n "${BEFORE:-}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            base="${BEFORE}"
          else
            base="HEAD"
          fi
          echo "anchoring accepted ADRs to ${base}"
          uv run --frozen python -m dwcheck --adr-base "${base}" --require-adr-history adr
      # The gate is not "a checker is configured" but "the checker rejects a
      # known violation". The proof runs here, against the deliberately-invalid
      # fixture tree, and fails the job if the checker ever accepts it.
      - name: The checker must reject the violation fixture
        run: |
          set +e
          uv run --frozen python -m dwcheck \
            --root tests/architecture/fixtures/violations \
            --rules architecture.toml all
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::dwcheck accepted the deliberately-invalid fixture tree"
            exit 1
          fi
          echo "dwcheck rejected the fixture tree as expected (exit $status)"

  schema:
    name: generated protocol files (make schema-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
      - uses: ./.github/actions/setup
      # schemas/, docs/DWKP_OPERATIONS.md and runtime/src/direwolf/proto/ are
      # generated (ADR-0033). A hand edit, or a Rust change committed without
      # `make schema`, fails here rather than surfacing as a parity bug.
      - run: make schema-check

  evals:
    name: evals (make eval-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
      - uses: ./.github/actions/setup
      # The deterministic subset: no secrets, no model call, no network. It
      # compares against evals/baselines/main.json and fails on a regression;
      # nothing here rewrites that file. Pending suites are reported as pending,
      # which is neither a pass nor a skip.
      #
      # The M3 authority suite runs the real `dwkd-authority` process here.
      # Strict (ADR-0041): an eval this job cannot exercise FAILS the gate
      # rather than being listed as not exercised -- and `scripts/dw.py` makes
      # the gate strict under GitHub Actions even without the line below.
      # `nobody`, reached through the runner's passwordless sudo, is the second
      # operating-system identity the cross-uid property needs, accepted only
      # if its numeric uid is neither the runner's nor root's. The harness
      # switches users; the authority never does.
      - run: make eval-check
        env:
          DW_EVAL_REQUIRE_EXERCISED: "1"
          DW_PEER_AS: nobody
      - name: Keep the machine-readable results when the gate fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results
          path: target/evals/results.jsonl
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: tests (make test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the primary target. Windows is here because the CLI has
        # platform-specific code paths and native Windows is a documented
        # reduced-assurance target that must still build. macOS is here because
        # it is a supported development platform.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
      - uses: ./.github/actions/setup
      - run: python scripts/dw.py test

  # M3e's real-process evidence (ADR-0041): the released binary, a real
  # Unix-domain socket, a client in another process -- and a client running as
  # a genuinely different uid, which is the only evidence that the server's
  # subject comes from the kernel. Then M3d's runtime-write probe under the
  # same second identity (ADR-0039 section 14), then the M3 eval gate, strict.
  # Linux: where the server runs.
  #
  # Fail-closed, by construction rather than by care: `nobody` is proven to be
  # a second identity by its numeric uid before anything runs (it must differ
  # from the runner's and must not be root), the two `#[ignore]`d cross-uid
  # tests are selected by name and must both run and report every case, and
  # the strict gate fails an eval it could not exercise. No step here may be
  # conditional or allowed to fail; the `ci` job below requires this one.
  authority-transport:
    name: authority boundary (make authority-transport-evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
      - uses: ./.github/actions/setup
      - run: make authority-transport-evidence
        env:
          DW_PEER_AS: nobody
      - run: make authority-write-probe
        env:
          DW_PROBE_AS: nobody
      - run: make eval-check
        env:
          DW_EVAL_REQUIRE_EXERCISED: "1"
          DW_PEER_AS: nobody

  # M4a's canonical filesystem evidence (ADR-0042): the production resolver
  # against real symlinks, magic links, mount points, hard links, Unicode
  # aliases and a replaced root, and the TOCTOU race campaigns. Linux: the
  # resolver is openat2. The task fails on a missing category, a race campaign
  # that did not report or escaped, or a case not exercised that an ordinary
  # runner can exercise -- nothing here is conditional.
  filesystem-canonicalization:
    name: canonical filesystem (make filesystem-canonicalization-evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
      - uses: ./.github/actions/setup
      - run: make filesystem-canonicalization-evidence

  # M4b's brokered fs.read evidence (ADR-0043): the released authority and
  # broker binaries end to end over the private channel, the crash-point sweep,
  # a hostile broker and a hostile authority-side peer on the real channel, the
  # cross-process TOCTOU campaign -- and then THREE genuine identities: the
  # runner as the authority, a broker user created here, and `nobody` as the
  # hostile runtime. Each is proven by its numeric uid before anything runs
  # (distinct from the runner, from root and from each other); the three
  # `#[ignore]`d three-identity tests are selected by name and must all run and
  # report every case. The harness starts the broker as its user through
  # `sudo -n -u`; the authority switches no users. Nothing here is conditional,
  # and the `ci` job below requires this one.
  broker-fs-read:
    name: brokered fs.read (make broker-fs-read-evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
      - uses: ./.github/actions/setup
      - name: Create the broker's own identity
        run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin dwbroker
      - run: make broker-fs-read-evidence
        env:
          DW_BROKER_AS: dwbroker
          DW_PEER_AS: nobody

  supply-chain:
    name: dependencies (make security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
      - uses: ./.github/actions/setup
      - name: Cache cargo-deny
        id: cache-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}
      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        # Pinned and --locked: a supply-chain tool installed from a floating
        # version is a supply-chain risk of its own.
        run: cargo install cargo-deny --version 0.20.2 --locked
      - run: make security

  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.1
      - uses: ./.github/actions/setup
      # The release profile enables LTO, one codegen unit and panic=abort; it
      # can fail where a debug build does not, and a release-only failure
      # discovered at release time is a bad day.
      - run: cargo build --workspace --release
      - run: ./target/release/direwolf --version

  # A single required check for branch protection, so adding a job later does
  # not silently become optional.
  #
  # `always()` so that this job runs -- and fails -- when a job it needs did
  # not succeed. Only "success" counts: a "skipped" job proved nothing, so a
  # skipped authority-transport (a condition added later, a job that never
  # started) is as red as a failed one.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, architecture, schema, evals, test, authority-transport, filesystem-canonicalization, broker-fs-read, supply-chain, build]
    if: always()
    steps:
      - name: Fail unless every required job succeeded
        env:
          # Through the environment, not interpolated into the script.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          if not needs:
              print("::error::the aggregate job depends on no jobs")
              sys.exit(1)
          failed = sorted(
              (name, job.get("result")) for name, job in needs.items()
              if job.get("result") != "success"
          )
          for name, result in failed:
              print(f"::error::required job {name} finished {result!r}; only 'success' counts")
          if failed:
              sys.exit(1)
          print(f"all {len(needs)} required CI jobs succeeded")
          PY
