name: Set up the DireWolf toolchain
description: >-
  Installs a pinned uv, restores the cargo and uv caches, and reports the Rust
  toolchain. Deliberately uses no third-party actions: every extra action is a
  third party with write access to a build that produces our release artifacts.

inputs:
  rust:
    description: Set up the Rust toolchain as well as Python
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # uv is installed from PyPI at a pinned version rather than through the
    # vendor's `curl | sh` installer. Piping a remote script into a shell in CI
    # is the pattern this project's own threat model exists to argue against,
    # and pip gives us a version and a hash-checked wheel.
    - name: Install uv (pinned)
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "uv==0.12.13"

    - name: Show Rust toolchain
      if: inputs.rust == 'true'
      shell: bash
      # rustup reads rust-toolchain.toml and installs the pinned channel and
      # its components. Doing it here keeps the install out of the timing of
      # whatever command follows.
      run: |
        rustup show active-toolchain || rustup toolchain install
        rustc --version
        cargo --version

    - name: Cache cargo registry and build output
      if: inputs.rust == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: cargo-${{ runner.os }}-

    - name: Cache uv downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: uv-${{ runner.os }}-

    - name: Sync the locked Python environment
      shell: bash
      # --frozen: CI must fail on a stale lockfile rather than silently
      # resolving something different from what the contributor tested.
      run: uv sync --all-packages --frozen
