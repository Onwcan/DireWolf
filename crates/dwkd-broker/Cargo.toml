[package]
name = "dwkd-broker"
description = "DireWolf execution broker: does. Filesystem, exec, sandbox, egress. Holds no long-lived key."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Half of the authority plane; never published. Also what lets it inherit the
# in-tree `dwk-proto` by path without a version (deny.toml, `wildcards`).
publish = false

[[bin]]
name = "dwkd-broker"
path = "src/main.rs"

[lints]
workspace = true

# This crate is expected to carry the large dependencies the authority plane
# must not: a container client, an HTTP/TLS stack, content parsers.  That is
# the point of the split (ADR-0018).  It may not depend on `dwkd-authority`,
# and `dwcheck deps` enforces that.
#
# M4b (ADR-0043) needs very little: the private protocol's wire types, which
# both daemons must agree on and which live in the one crate both may link, and
# the kernel's peer credentials and descriptor passing. Nothing here is linked
# into the authority.
[dependencies]
dwk-proto = { workspace = true }

# `SO_PEERCRED`, `recvmsg` with `SCM_RIGHTS`, `fstat`, `fcntl` and `pread`,
# through the same maintained safe wrapper and the same features the authority
# already uses -- so a workspace build unifies to exactly the authority's
# rustix, and the broker adds no feature to it. Linux only, like the channel.
#
# M4d (ADR-0045 §20) adds the broker's own features, never the authority's:
# `process` (`pidfd_open`, `pidfd_send_signal`, `kill_process_group`,
# `waitid`, `setrlimit`, `fchdir`, the parent-death signal) and `thread`
# (`set_no_new_privs`). Both add code, not crates (`linux-raw-sys/prctl`). In
# a build of the whole workspace Cargo unifies them into the one `rustix` the
# authority also links; the authority names none of them (TX008, TX010), and
# ADR-0045 records the delta.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["process", "thread"] }
# The launch helper's `execveat` (ADR-0045 §9): see the workspace manifest.
nix = { workspace = true }
# M4c (ADR-0044 §12): `fs.patch` proves a file holds its base revision, and
# its result the post revision, by SHA-256 -- the digest the runtime states
# them by. The same pinned, pure-Rust crate and features the authority uses.
sha2 = { workspace = true }
