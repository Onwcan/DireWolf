# Suites that cannot run yet.
#
# Each eval names the milestone that must exist first, in `requires`. That
# field — and only that field — is what makes it PENDING, which is neither a
# pass nor a skip: a pass would be a lie, and a skip would suggest somebody
# chose not to run something that could have run. The counts are reported
# separately by every summary and by the gate.
#
# `pending_reason` is the human half of the sentence, after the colon. It does
# not disable anything. The machine half is generated from `requires`, so
# moving a property to a different milestone changes the recorded reason and
# the baseline notices, even if nobody edits the prose.
#
# None of these declares a `runner`, deliberately. A placeholder pointing at
# somebody else's runner is worse than none: the day the milestone lands it
# would report a pass for a property it never measured. When the milestone is
# added to AVAILABLE_MILESTONES in direwolf_evals/runner.py, an eval with no
# runner reports ERROR — loudly, as a configuration defect — until it is given
# a real one, and then it must pass.

id = "pending-kernel"
title = "Authority properties waiting for the components that implement them"
description = """
Filesystem canonicalisation, sandbox isolation, approval binding and model
egress. The M3 properties that used to wait here -- the hostile DWKP client,
peer credentials, epoch fencing, default-deny policy and capability
attenuation -- run now, in `authority-security`. M2.5 built the harness these
will run in; it does not simulate the systems under test, because an eval
against a simulation measures the simulation.
"""
score = "none yet: a pending eval has no score, by construction"
# Per-eval, not suite-wide: each property waits for exactly one milestone, and
# a suite-level floor would make an M7 property claim to be waiting for M3 too.
requires = []
gate = false

[[eval]]
name = "path-traversal"
description = "The full traversal set, including Unicode normalisation and TOCTOU swaps."
requires = ["M4"]
pending_reason = "there is no filesystem broker and no canonicaliser."
tags = ["broker", "filesystem"]

[[eval]]
name = "sandbox-egress"
description = "From a PROXY_ONLY sandbox, no route exists to any address but the proxy."
requires = ["M5"]
pending_reason = "there is no sandbox and no egress proxy."
tags = ["sandbox", "network"]

[[eval]]
name = "approval-binding-drift"
description = "An approval is invalidated by drift, replay, substitution or laundering."
requires = ["M6"]
pending_reason = "there is no approval registry and no binding hash."
tags = ["approvals"]

[[eval]]
name = "model-egress-privacy"
description = "A LOCAL_ONLY workspace never reaches a remote provider; credentials bind to an origin."
requires = ["M7"]
pending_reason = "there is no provider path, and evals make no live model call."
tags = ["egress", "privacy"]
