# The integrated M5 gate (M5e.6; M5E6_PREPARATION_HANDOFF.md §§6, 9).
#
# WHAT THIS SUITE MEASURES: that every M5 evidence task ran in this run, on
# this commit, on a disposable GitHub-hosted runner, and passed its own
# judgement again over the output it kept: the attributed inventory complete
# (less the tables not yet required), the self-judging tasks by their own
# verdicts, every census clean -- and that the M5e acceptance verdict is
# READY: M5e.5's evidence required, ADR-0054 and ADR-0055 accepted with E6's
# records, and the plan recording each step's closure or acceptance. The
# runner is `direwolf_evals/runners/m5e.py`, which runs `scripts/dw.py
# m5e-gate-check` and reimplements nothing.
#
# WHAT IT DOES NOT MEASURE: anything the evidence tasks do not. It adds no
# boundary and no kind of evidence; it judges what the required jobs kept.
#
# WHERE IT CAN RUN: only in CI's `m5e-gate` job, which downloads this run's
# bundles; anywhere else NOT EXERCISED, never a pass. That job runs it strict
# (`check --all --suite m5e-gate --require-exercised`). It is not in the
# deterministic subset the `evals` job runs, because only the gate job has the
# bundles: hence `gate = false`, and the `m5e-gate` job is the merge gate.
#
# PENDING until `M5e` joins AVAILABLE_MILESTONES (G5), a decision of its own.
# From that commit on, a NOT READY verdict fails CI loudly; it never passes
# quietly.

id = "m5e-gate"
title = "Every M5 evidence task passed again, in this run, and M5e is ready"
description = """
The M5 evidence tasks' kept output, from this run's GitHub-hosted jobs,
judged again by the functions that judged it: every case of the inventory at
its level with its attribution, the self-judging tasks by their own verdicts,
every census clean; and the M5e acceptance verdict READY.
"""
score = "binary: 1 when the gate task passes with a complete inventory and a READY acceptance verdict, else 0"
requires = ["M5e"]
gate = false

[[eval]]
name = "integrated-m5-gate"
description = "This run's M5 evidence bundles judged again, the inventory complete, and the M5e acceptance verdict READY."
runner = "m5e.gate"
scorer = "binary"
platforms = ["linux"]
needs = ["m5e-gate-job"]
pending_reason = "the M5 gate's inventory verdict runs in CI's `m5e-gate` job from M5e.6's G2 on; `M5e` becomes available only with M5e.5 accepted (the M5E6 handoff's §9)."
timeout_s = 600.0
tags = ["sandbox", "gate"]
