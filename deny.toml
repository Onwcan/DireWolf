# cargo-deny configuration.
#
# cargo-deny is the ONLY Rust supply-chain gate in this repository.  It covers
# advisories (the same RustSec database `cargo-audit` reads), licences, banned
# crates, duplicate versions and source registries.  `cargo-audit` is
# deliberately NOT used as well: it would give the same advisory signal twice
# and produce two places to suppress a finding.  See CONTRIBUTING.md.
#
# M1 had zero third-party Rust dependencies.  M2 adds the first: one crate
# reachable from the TCB-destined dwk-proto (unicode-normalization, with tinyvec
# and tinyvec_macros) and two dev-only test crates (proptest, serde_json) with
# their transitive dependencies.  Every section below now has something to
# check.  Duplicate versions are checked for non-dev dependencies only
# (cargo-deny's `multiple-versions-include-dev` defaults to false): the dev-only
# tree currently carries syn 2 and syn 3, via proptest and serde_json.

[graph]
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Any vulnerability, unmaintained crate or yanked version fails the build.
# An exception is an entry in `ignore` below with a comment naming the reviewer
# and the reason.  An empty `ignore` list is the goal state.
ignore = []
yanked = "deny"
unmaintained = "workspace"

# ---------------------------------------------------------------------------
# Licences
#
# The project is Apache-2.0 (ADR-0030).  The allowlist is the set of licences
# that can be redistributed inside an Apache-2.0 binary without additional
# obligations.  Copyleft licences are absent on purpose: a GPL dependency in
# `dwkd-authority` would change the licence of the shipped kernel.
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93
# One crate, one licence, version-exact in Cargo.toml: `webpki-roots` is data --
# Mozilla's CA certificate store, compiled into the broker for its HTTPS client
# (ADR-0050 §18) -- published under CDLA-Permissive-2.0, a permissive data
# licence with no copyleft and no obligation beyond keeping the notice. It is
# linked by `dwkd-broker` only, never by the authority.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
# Two copies of a crate in the tree means two copies of its bugs, and in the
# TCB it means an auditor has to read both.  Duplicates require an explicit
# `skip` entry with a reason.
multiple-versions = "deny"
wildcards = "deny"
# In-tree crates are inherited as `{ path = "crates/..." }` with no version:
# their version is the workspace version, synchronised from VERSION.  This
# permits a version-less `path` dependency only where the depending crate is
# `publish = false` (cargo-deny's rule): today dwk-proto, protogen and, since
# M3d made it depend on dwk-proto, dwkd-authority.  A
# version-less registry or git dependency is still a wildcard and still denied.
allow-wildcard-paths = true
# M4e (ADR-0046 §25) is the first milestone whose TCB carries duplicate versions:
# age 0.11.5 and keyring 3.6.3 bring their own, and each is listed below
# with its reason, version-exact, so a third copy or a changed version fails.
skip = [
    { crate = "digest@0.10.7", reason = "age 0.11.5 (ADR-0046 §25) is built on the previous RustCrypto generation (digest 0.10); the workspace's sha2 and hmac, and age's own rust-embed-utils, are on digest 0.11. Both copies are linked into the authority and are reviewed as two" },
    { crate = "block-buffer@0.10.4", reason = "age 0.11.5 (ADR-0046 §25) is built on the previous RustCrypto generation (digest 0.10); the workspace's sha2 and hmac, and age's own rust-embed-utils, are on digest 0.11. Both copies are linked into the authority and are reviewed as two" },
    { crate = "crypto-common@0.1.7", reason = "age 0.11.5 (ADR-0046 §25) is built on the previous RustCrypto generation (digest 0.10); the workspace's sha2 and hmac, and age's own rust-embed-utils, are on digest 0.11. Both copies are linked into the authority and are reviewed as two" },
    { crate = "cpufeatures@0.2.17", reason = "age 0.11.5 (ADR-0046 §25) is built on the previous RustCrypto generation (digest 0.10); the workspace's sha2 and hmac, and age's own rust-embed-utils, are on digest 0.11. Both copies are linked into the authority and are reviewed as two" },
    { crate = "sha2@0.10.9", reason = "age 0.11.5 (ADR-0046 §25) is built on the previous RustCrypto generation (digest 0.10); the workspace's sha2 and hmac, and age's own rust-embed-utils, are on digest 0.11. Both copies are linked into the authority and are reviewed as two" },
    { crate = "hmac@0.12.1", reason = "age 0.11.5, hkdf and pbkdf2 use hmac 0.12 (digest 0.10); the redaction index's HMAC-SHA-256 uses hmac 0.13 over the workspace's sha2 0.11 (ADR-0046 §21), rather than a second sha2" },
    { crate = "rustc-hash@1.1.0", reason = "inside age's localisation stack: fluent-bundle 0.15 takes rustc-hash 1, its own intl-memoizer's type-map takes 2 (ADR-0046 §25)" },
    { crate = "syn@2.0.119", reason = "proc macros only, never linked: dalek's, zeroize's and age's localisation derives use syn 2; serde_derive, displaydoc and futures-macro use syn 3 (ADR-0046 §25)" },
    { crate = "toml@0.5.11", reason = "build time only: find-crate, which i18n-embed's proc macros use to read Cargo.toml, takes toml 0.5; the policy and secret-metadata loaders use toml 1" },
    { crate = "windows-sys@0.60.2", reason = "keyring 3.6.3 (the Windows Credential Manager backend, ADR-0046 §6) takes 0.60; rustix, errno and winapi-util take 0.61. Windows only, and the authority serves nothing there" },
    { crate = "base64@0.21.7", reason = "age 0.11.5 (ADR-0046 §25, the authority) takes base64 0.21; ureq-proto 0.6.4 (ADR-0050 §18, the broker only) takes 0.23, for Basic userinfo the broker never sends -- a URL with userinfo is refused before it is decided. One copy per daemon" },
    # M5c (ADR-0050 §18, D1): ring 0.17.14, rustls's crypto provider in the
    # broker, takes windows-sys 0.52 and its target crates on Windows. The
    # broker serves only on Linux (ADR-0050 §19), so no daemon that runs links
    # any of them; each is listed, version-exact, so a third copy fails.
    { crate = "windows-sys@0.52.0", reason = "ring 0.17.14 (the broker's TLS provider, ADR-0050 §18) on Windows only; the broker serves only on Linux" },
    { crate = "windows-targets@0.52.6", reason = "ring 0.17.14 via windows-sys 0.52, Windows only; the broker serves only on Linux (ADR-0050 §18)" },
    { crate = "windows_aarch64_gnullvm@0.52.6", reason = "ring 0.17.14 via windows-sys 0.52, Windows only; the broker serves only on Linux (ADR-0050 §18)" },
    { crate = "windows_aarch64_msvc@0.52.6", reason = "ring 0.17.14 via windows-sys 0.52, Windows only; the broker serves only on Linux (ADR-0050 §18)" },
    { crate = "windows_i686_gnu@0.52.6", reason = "ring 0.17.14 via windows-sys 0.52, Windows only; the broker serves only on Linux (ADR-0050 §18)" },
    { crate = "windows_i686_gnullvm@0.52.6", reason = "ring 0.17.14 via windows-sys 0.52, Windows only; the broker serves only on Linux (ADR-0050 §18)" },
    { crate = "windows_i686_msvc@0.52.6", reason = "ring 0.17.14 via windows-sys 0.52, Windows only; the broker serves only on Linux (ADR-0050 §18)" },
    { crate = "windows_x86_64_gnu@0.52.6", reason = "ring 0.17.14 via windows-sys 0.52, Windows only; the broker serves only on Linux (ADR-0050 §18)" },
    { crate = "windows_x86_64_gnullvm@0.52.6", reason = "ring 0.17.14 via windows-sys 0.52, Windows only; the broker serves only on Linux (ADR-0050 §18)" },
    { crate = "windows_x86_64_msvc@0.52.6", reason = "ring 0.17.14 via windows-sys 0.52, Windows only; the broker serves only on Linux (ADR-0050 §18)" },
]
skip-tree = []

deny = [
    # TLS: the project standardises on rustls.  Linking OpenSSL pulls a C
    # dependency and a second certificate-verification implementation into a
    # process that performs egress; see ADR-0018 (the broker is the only place
    # TLS belongs) and docs/NETWORK_SECURITY.md.
    { crate = "openssl", reason = "use rustls; see docs/NETWORK_SECURITY.md" },
    { crate = "openssl-sys", reason = "use rustls; see docs/NETWORK_SECURITY.md" },
    { crate = "native-tls", reason = "use rustls; see docs/NETWORK_SECURITY.md" },
    # `git2`/libgit2 would put a large C parser for attacker-supplied
    # repository data inside a Rust process.  Repository operations belong in
    # the broker as brokered `process.exec` of the `git` binary.
    { crate = "git2", reason = "invoke the git binary through the exec broker instead" },
    # `net.http` (ADR-0050 §9): the broker dials only the addresses the guard
    # pinned, and trusts only the compiled-in roots. A client with its own
    # resolver, connection pool, redirect following or ambient proxy settings,
    # a second DNS resolver, or the host's trust store would each undo one of
    # those, quietly.
    { crate = "reqwest", reason = "net.http is the broker's own client over pinned addresses; see ADR-0050 §9" },
    { crate = "hickory-resolver", reason = "names are resolved once, by the broker's one resolver; see ADR-0050 §6" },
    { crate = "trust-dns-resolver", reason = "names are resolved once, by the broker's one resolver; see ADR-0050 §6" },
    { crate = "rustls-native-certs", reason = "the HTTPS client trusts webpki-roots only, never the host's store; see ADR-0050 §9" },
    { crate = "rustls-platform-verifier", reason = "the HTTPS client trusts webpki-roots only, never the host's store; see ADR-0050 §9" },
]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
