# cargo-deny configuration.
#
# cargo-deny is the ONLY Rust supply-chain gate in this repository.  It covers
# advisories (the same RustSec database `cargo-audit` reads), licences, banned
# crates, duplicate versions and source registries.  `cargo-audit` is
# deliberately NOT used as well: it would give the same advisory signal twice
# and produce two places to suppress a finding.  See CONTRIBUTING.md.
#
# M1 had zero third-party Rust dependencies.  M2 adds the first: one crate
# reachable from the TCB-destined dwk-proto (unicode-normalization, with tinyvec
# and tinyvec_macros) and two dev-only test crates (proptest, serde_json) with
# their transitive dependencies.  Every section below now has something to
# check.  Duplicate versions are checked for non-dev dependencies only
# (cargo-deny's `multiple-versions-include-dev` defaults to false): the dev-only
# tree currently carries syn 2 and syn 3, via proptest and serde_json.

[graph]
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Any vulnerability, unmaintained crate or yanked version fails the build.
# An exception is an entry in `ignore` below with a comment naming the reviewer
# and the reason.  An empty `ignore` list is the goal state.
ignore = []
yanked = "deny"
unmaintained = "workspace"

# ---------------------------------------------------------------------------
# Licences
#
# The project is Apache-2.0 (ADR-0030).  The allowlist is the set of licences
# that can be redistributed inside an Apache-2.0 binary without additional
# obligations.  Copyleft licences are absent on purpose: a GPL dependency in
# `dwkd-authority` would change the licence of the shipped kernel.
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93
exceptions = []

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
# Two copies of a crate in the tree means two copies of its bugs, and in the
# TCB it means an auditor has to read both.  Duplicates require an explicit
# `skip` entry with a reason.
multiple-versions = "deny"
wildcards = "deny"
# In-tree crates are inherited as `{ path = "crates/..." }` with no version:
# their version is the workspace version, synchronised from VERSION.  This
# permits a version-less `path` dependency only where the depending crate is
# `publish = false` (cargo-deny's rule): today dwk-proto and protogen.  A
# version-less registry or git dependency is still a wildcard and still denied.
allow-wildcard-paths = true
skip = []
skip-tree = []

deny = [
    # TLS: the project standardises on rustls.  Linking OpenSSL pulls a C
    # dependency and a second certificate-verification implementation into a
    # process that performs egress; see ADR-0018 (the broker is the only place
    # TLS belongs) and docs/NETWORK_SECURITY.md.
    { crate = "openssl", reason = "use rustls; see docs/NETWORK_SECURITY.md" },
    { crate = "openssl-sys", reason = "use rustls; see docs/NETWORK_SECURITY.md" },
    { crate = "native-tls", reason = "use rustls; see docs/NETWORK_SECURITY.md" },
    # `git2`/libgit2 would put a large C parser for attacker-supplied
    # repository data inside a Rust process.  Repository operations belong in
    # the broker as brokered `process.exec` of the `git` binary.
    { crate = "git2", reason = "invoke the git binary through the exec broker instead" },
]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
