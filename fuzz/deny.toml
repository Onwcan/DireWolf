# cargo-deny policy for the FUZZ WORKSPACE ONLY.
#
# `fuzz/` is its own Cargo workspace with its own lockfile, so the root
# deny.toml does not see it. Its dependencies are still supply-chain inputs —
# they are compiled and executed on developer machines and on CI runners — so
# they are audited, with this file, by `make security`:
#
#     cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check
#
# The distinction this file exists to keep explicit (ADR-0019, ADR-0033):
#
#   product dependency   linked into a shipped binary          — none today
#   TCB dependency       reachable from dwkd-authority         — none today
#   dev dependency       compiled for `cargo test`             — root deny.toml
#   fuzz-only dependency compiled only for `make fuzz`         — HERE
#
# Fuzz-only crates are NOT in architecture.toml's authority allowlist and must
# never be added to it: nothing here may become reachable from a shipped
# binary. `dwcheck` enforces that separately, by reading the root manifests.

[graph]
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories. Same standard as the product tree: a vulnerable or unmaintained
# crate is a finding here too, because this code runs on our machines.
# ---------------------------------------------------------------------------
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []
yanked = "deny"
unmaintained = "workspace"

# ---------------------------------------------------------------------------
# Licences.
#
# This list is the root allowlist plus NCSA, which libFuzzer itself carries:
# `libfuzzer-sys` vendors the upstream LLVM libFuzzer sources and is offered
# under "MIT OR Apache-2.0 OR NCSA". Nothing under this policy is shipped, so
# the obligations are those of a development tool, not of a distributed
# artifact — and that is exactly why it is a separate file from the root one.
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93
exceptions = []

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "deny"
wildcards = "deny"
# `dwk-proto` and `dwkd-authority` are inherited by path from the parent
# workspace, and every crate involved is `publish = false`.
allow-wildcard-paths = true
# M4e (ADR-0046 §25) is the first milestone whose TCB, which the policy-loader targets link, carries duplicate versions:
# age 0.11.5 and keyring 3.6.3 bring their own, and each is listed below
# with its reason, version-exact, so a third copy or a changed version fails.
skip = [
    { crate = "digest@0.10.7", reason = "age 0.11.5 (ADR-0046 §25) is built on the previous RustCrypto generation (digest 0.10); the workspace's sha2 and hmac, and age's own rust-embed-utils, are on digest 0.11. Both copies are linked into the authority and are reviewed as two" },
    { crate = "block-buffer@0.10.4", reason = "age 0.11.5 (ADR-0046 §25) is built on the previous RustCrypto generation (digest 0.10); the workspace's sha2 and hmac, and age's own rust-embed-utils, are on digest 0.11. Both copies are linked into the authority and are reviewed as two" },
    { crate = "crypto-common@0.1.7", reason = "age 0.11.5 (ADR-0046 §25) is built on the previous RustCrypto generation (digest 0.10); the workspace's sha2 and hmac, and age's own rust-embed-utils, are on digest 0.11. Both copies are linked into the authority and are reviewed as two" },
    { crate = "cpufeatures@0.2.17", reason = "age 0.11.5 (ADR-0046 §25) is built on the previous RustCrypto generation (digest 0.10); the workspace's sha2 and hmac, and age's own rust-embed-utils, are on digest 0.11. Both copies are linked into the authority and are reviewed as two" },
    { crate = "sha2@0.10.9", reason = "age 0.11.5 (ADR-0046 §25) is built on the previous RustCrypto generation (digest 0.10); the workspace's sha2 and hmac, and age's own rust-embed-utils, are on digest 0.11. Both copies are linked into the authority and are reviewed as two" },
    { crate = "hmac@0.12.1", reason = "age 0.11.5, hkdf and pbkdf2 use hmac 0.12 (digest 0.10); the redaction index's HMAC-SHA-256 uses hmac 0.13 over the workspace's sha2 0.11 (ADR-0046 §21), rather than a second sha2" },
    { crate = "rustc-hash@1.1.0", reason = "inside age's localisation stack: fluent-bundle 0.15 takes rustc-hash 1, its own intl-memoizer's type-map takes 2 (ADR-0046 §25)" },
    { crate = "syn@2.0.119", reason = "proc macros only, never linked: dalek's, zeroize's and age's localisation derives use syn 2; serde_derive, displaydoc and futures-macro use syn 3 (ADR-0046 §25)" },
    { crate = "toml@0.5.11", reason = "build time only: find-crate, which i18n-embed's proc macros use to read Cargo.toml, takes toml 0.5; the policy and secret-metadata loaders use toml 1" },
    { crate = "windows-sys@0.60.2", reason = "keyring 3.6.3 (the Windows Credential Manager backend, ADR-0046 §6) takes 0.60; rustix, errno and winapi-util take 0.61. Windows only, and the authority serves nothing there" },
    { crate = "getrandom@0.2.17", reason = "age's x25519-dalek (rand_core 0.6) and the redaction key take getrandom 0.2; 0.4 is jobserver's, which cc uses to build libfuzzer-sys and SQLite (build time only)" },
]
skip-tree = []
deny = [
    # A fuzz target that reached the network would be fuzzing someone else's
    # service, not our parser.
    { crate = "reqwest", reason = "fuzz targets take bytes, not sockets" },
    { crate = "hyper", reason = "fuzz targets take bytes, not sockets" },
    { crate = "tokio", reason = "the targets are synchronous by design" },
]

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
